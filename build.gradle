plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}
version = '1.0.6'
group = 'io.github.arcaneanviljeioptimization'
base { archivesName = 'arcane-anvil-jei-optimization' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft { mappings channel: 'official', version: '1.20.1' }
mixin {
    add sourceSets.main, 'arcane_anvil_jei_optimization.refmap.json'
    config 'arcane_anvil_jei_optimization.mixins.json'
}
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.blamejared.com' } }
        filter { includeModule 'mezz.jei', 'jei-1.20.1-forge' }
    }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // 分别解析同一模块的两个版本，旧版类优先，新版补充内部接口。
    ['15.20.0.132', '15.74.0.234'].each { jeiVersion ->
        def jei = dependencies.create("mezz.jei:jei-1.20.1-forge:${jeiVersion}@jar")
        compileOnly files(configurations.detachedConfiguration(jei))
    }
}
tasks.named('jar', Jar) {
    manifest { attributes 'MixinConfigs': 'arcane_anvil_jei_optimization.mixins.json' }
    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'mod_version': project.version
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
